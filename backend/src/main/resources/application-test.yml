server:
  port: 0

spring:
  application:
    name: nitro-rush-backend-test
  datasource:
    url: jdbc:h2:mem:nitrorush;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  data:
    redis:
      repositories:
        enabled: false

app:
  jwt:
    secret: nitro_rush_super_secret_jwt_key_32_bytes_min_dev_default_key_12345
    expiration-min: 15
    refresh-expiration-days: 7

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{requestId}] %-5level %logger{36} - %msg%n"
